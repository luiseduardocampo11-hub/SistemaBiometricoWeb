
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Biométrico Facial</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="login-card">
        <div class="logo">SF</div>

        <h1>Sistema Biométrico Facial</h1>
        <p class="subtitle">Control de asistencia laboral</p>

        <form id="loginForm">
            <label for="correo">Correo electrónico</label>
            <input
                type="email"
                id="correo"
                placeholder="usuario@empresa.com"
                autocomplete="username"
                required
            >

            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                placeholder="Ingresa tu contraseña"
                autocomplete="current-password"
                required
            >

            <button type="submit">Iniciar sesión</button>

            <p id="mensaje" role="status" aria-live="polite"></p>
        </form>

        <footer>Versión 1.0 · Sistema de asistencia</footer>
    </main>
</body>
</html>
